plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.earlyWindowControl', 'false'
            // Enable Vulkan experimental backend by default in development client
            programArguments.addAll '--graphicsBackend', 'vulkan'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet project.sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    testImplementation.extendsFrom(compileClasspath)
}

dependencies {
    // LWJGL Vulkan API & Extensions for development / compile-time type-safety
    compileOnly 'org.lwjgl:lwjgl-vulkan:3.3.3'
    testImplementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Process resources and replace tokens in neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version   : project.minecraft_version,
        mod_id              : project.mod_id,
        mod_name            : project.mod_name,
        mod_license         : project.mod_license,
        mod_version         : project.mod_version,
        mod_authors         : project.mod_authors,
        mod_description     : project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
